<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-lang="school_title">Управление Школой - GRO-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        ui: { bg: '#f8fafc', adminNav: '#1e1b4b' },
                        jw: { ministry: '#d97706' }
                    } 
                } 
            } 
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* СПЕЦИАЛЬНЫЕ СТИЛИ ДЛЯ ПЕЧАТИ БЛАНКОВ */
        .print-only { display: none; }
        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            main { padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
            .print-only { 
                display: grid !important; 
                grid-template-columns: 1fr 1fr; 
                gap: 20px; 
                width: 100%;
                padding: 10px;
            }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body class="bg-ui-bg text-slate-800 min-h-screen font-sans">

    <nav class="fixed bottom-0 left-0 w-full bg-ui-adminNav flex flex-row items-center justify-center z-50 md:top-0 md:h-screen md:w-20 md:flex-col md:justify-start md:py-6 pb-safe border-t border-indigo-900 md:border-t-0 no-print">
        <a href="index.html" data-lang-title="back_home" class="nav-btn group flex flex-col items-center justify-center flex-1 py-3 md:flex-none md:w-full outline-none transition-colors">
            <div class="nav-icon-container text-indigo-300 hover:text-white p-2.5 rounded-full transition-colors flex flex-col items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 md:w-7 md:h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
                <span class="text-[8px] font-black uppercase tracking-widest hidden md:block" data-lang="btn_back">Назад</span>
            </div>
        </a>
    </nav>

    <main class="w-full max-w-5xl mx-auto pt-4 md:pt-6 px-4 pb-24 md:pl-28 md:pr-6 no-print">
        
        <div class="mb-6 flex justify-between items-center bg-white p-4 rounded-md border border-slate-200 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-md bg-[#d97706] text-white flex items-center justify-center shrink-0 shadow-sm">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-black text-slate-800 leading-none" data-lang="school_h1">Школа</h1>
                    <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest mt-1" data-lang="manage_tasks">Управление заданиями</p>
                </div>
            </div>
            
            <a href="school-stats.html" class="flex items-center gap-2 bg-slate-50 hover:bg-slate-100 text-slate-600 px-3 py-2 rounded-md border border-slate-200 transition-colors font-bold text-[10px] uppercase tracking-widest outline-none shadow-sm">
                <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                <span class="hidden md:inline" data-lang="btn_stats">Статистика</span>
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8">
            
            <div class="md:col-span-1">
                <div class="bg-white p-5 rounded-md border border-slate-200 shadow-sm sticky top-6">
                    <h2 class="text-sm font-black text-slate-800 mb-5 flex items-center gap-2 uppercase tracking-widest border-b border-slate-100 pb-2">
                        <span data-lang="assign_title">Назначить</span>
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1" data-lang="student_label">Ученик</label>
                            <select id="student-select" class="w-full bg-slate-50 border border-slate-200 rounded-md p-2.5 text-xs outline-none focus:border-jw-ministry font-bold text-slate-700 cursor-pointer shadow-sm">
                                <option value="" disabled selected data-lang="loading_students">Загрузка...</option>
                            </select>
                            <div id="student-history-hint" class="mt-2 text-[9px] font-bold px-1 hidden"></div>
                        </div>

                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1" data-lang="assistant_label">Помощник</label>
                            <select id="assistant-select" disabled class="w-full bg-slate-50 border border-slate-200 rounded-md p-2.5 text-xs outline-none focus:border-jw-ministry font-bold text-slate-700 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
                                <option value="" selected data-lang="select_student_first">Сначала выберите ученика</option>
                            </select>
                        </div>
                        
                        <div class="bg-slate-50 p-3 rounded-md border border-slate-100 space-y-3 shadow-inner">
                            <div class="flex gap-3">
                                <div class="w-1/3">
                                    <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1" data-lang="task_num">№</label>
                                    <select id="task-number" class="w-full bg-white border border-slate-200 rounded-md p-2 text-xs outline-none focus:border-jw-ministry font-bold text-slate-700 cursor-pointer shadow-sm">
                                        <option value="" disabled selected>-</option>
                                    </select>
                                </div>
                                <div class="w-2/3">
                                    <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1" data-lang="task_type">Тип</label>
                                    <select id="task-category" class="w-full bg-white border border-slate-200 rounded-md p-2 text-[10px] outline-none focus:border-jw-ministry font-bold text-slate-700 cursor-pointer shadow-sm">
                                        <option value="" disabled selected data-lang="opt_select">Выберите...</option>
                                        <option value="ЧТЕНИЕ БИБЛИИ" id="cat-reading">Чтение Библии</option>
                                        <option value="НАЧИНАЙТЕ РАЗГОВОР" data-lang="cat_conversation">Начинайте разговор</option>
                                        <option value="РАЗВИВАЙТЕ ИНТЕРЕС" data-lang="cat_interest">Развивайте интерес</option>
                                        <option value="ПОДГОТАВЛИВАЙТЕ УЧЕНИКОВ" data-lang="cat_disciples">Подготавливайте учеников</option>
                                        <option value="ОБЪЯСНЯЙТЕ СВОИ ВЗГЛЯДЫ" data-lang="cat_beliefs">Объясняйте свои взгляды</option>
                                        <option value="РЕЧЬ" id="cat-talk">Речь</option>
                                    </select>
                                </div>
                            </div>

                            <div class="flex gap-3">
                                <div class="w-1/3">
                                    <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1" data-lang="task_lesson">Урок</label>
                                    <select id="task-lesson" class="w-full bg-white border border-slate-200 rounded-md p-2 text-xs outline-none focus:border-jw-ministry font-bold text-slate-700 cursor-pointer shadow-sm">
                                        <option value="" disabled selected>-</option>
                                    </select>
                                </div>
                                <div class="w-2/3">
                                    <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1" data-lang="task_date">Дата</label>
                                    <input type="date" id="task-date" class="w-full bg-white border border-slate-200 rounded-md p-2 text-[11px] outline-none focus:border-jw-ministry font-bold text-slate-700 cursor-pointer shadow-sm">
                                </div>
                            </div>
                        </div>

                        <button id="assign-btn" data-lang="btn_assign" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-md transition-all active:scale-95 mt-4 text-[10px] uppercase tracking-widest outline-none shadow-sm">
                            Назначить
                        </button>
                    </div>
                </div>
            </div>

            <div class="md:col-span-2">
                <div class="flex justify-between items-center mb-4 bg-white p-3 rounded-md shadow-sm border border-slate-200">
                    <h2 class="text-sm font-black text-slate-800 uppercase tracking-widest pl-2" data-lang="schedule_title">График выступлений</h2>
                    <button onclick="window.print()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-md font-bold transition-colors outline-none shadow-sm border border-slate-200" title="Распечатать бланки">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                    </button>
                </div>
                
                <div id="tasks-list" class="space-y-3">
                    <p class="text-slate-500 italic p-6 text-center text-sm bg-white rounded-md border border-slate-200" data-lang="loading">Загрузка...</p>
                </div>
            </div>

        </div>
    </main>

    <div id="print-area" class="print-only"></div>

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module" src="school.js?v=115"></script>
</body>
</html>
