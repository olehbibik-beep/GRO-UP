<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-lang="full_calendar_title">Календарь - GRO-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        ui: { bg: '#f8fafc', nav: '#0f172a' }
                    } 
                } 
            } 
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { display: block; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-ui-bg text-slate-800 font-sans w-full h-[100dvh] overflow-hidden flex flex-col relative">

    <div id="global-loader" class="fixed inset-0 bg-ui-bg z-[200] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-slate-300 border-t-slate-800 mb-4"></div>
        <p class="text-[10px] font-bold text-slate-400 tracking-widest uppercase animate-pulse" data-lang="loading">Загрузка...</p>
    </div>

    <nav class="fixed bottom-0 left-0 w-full bg-ui-nav flex flex-row items-center justify-center z-50 md:top-0 md:h-screen md:w-20 md:flex-col md:justify-start md:py-6 pb-safe border-t border-slate-800 md:border-t-0 no-print">
        <a href="index.html" class="flex flex-col items-center justify-center py-4 w-full md:flex-none md:mb-4 outline-none transition-colors text-slate-400 hover:text-white" title="Назад">
            <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
        </a>
    </nav>

    <main class="flex-1 flex flex-col w-full max-w-lg mx-auto pt-4 md:pt-6 px-4 md:pl-28 md:pr-6 pb-20 md:pb-6 min-h-0 gap-3">
        
        <div class="flex items-center justify-between shrink-0 bg-white border border-slate-200 rounded-md p-3">
            <h1 class="text-sm font-black text-slate-800 leading-none uppercase tracking-widest" data-lang="archive_title">Архив</h1>
            <div class="flex items-center gap-4">
                <button onclick="changeYear(-1)" class="text-slate-400 hover:text-slate-800 text-xl font-black transition-colors outline-none">‹</button>
                <div id="display-year" class="text-sm font-black text-slate-800 w-10 text-center">...</div>
                <button onclick="changeYear(1)" class="text-slate-400 hover:text-slate-800 text-xl font-black transition-colors outline-none">›</button>
            </div>
        </div>

        <div id="months-grid" class="grid grid-cols-6 gap-1 md:gap-2 shrink-0">
            </div>

        <div class="flex-1 min-h-0 bg-slate-100 rounded-md border border-slate-300 flex flex-col overflow-hidden shadow-inner">
            <div id="selected-date-title" class="p-2 border-b border-slate-900 bg-slate-800 text-[10px] md:text-xs font-black text-white uppercase tracking-widest text-center shrink-0">
                Выберите день
            </div>
            <div id="events-panel-list" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-2">
                </div>
        </div>

        <div class="shrink-0 bg-white border border-slate-200 rounded-md flex flex-col h-[35vh] md:h-[280px]">
            <div class="grid grid-cols-7 gap-1 text-center text-[9px] font-bold text-slate-400 p-2 border-b border-slate-100 shrink-0">
                <span data-lang="dow_1">ПН</span><span data-lang="dow_2">ВТ</span><span data-lang="dow_3">СР</span><span data-lang="dow_4">ЧТ</span><span data-lang="dow_5">ПТ</span><span data-lang="dow_6">СБ</span><span data-lang="dow_7">ВС</span>
            </div>
            <div id="days-grid" class="grid grid-cols-7 gap-1 p-2 flex-1 auto-rows-fr content-start">
                </div>
        </div>

    </main>

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const dict = {
            ru: {
                "archive_title": "События", "back_home": "На главную", "btn_back": "Назад",
                "group_short": "Гр.", "leader_short": "Вед:", "full_calendar_title": "Календарь - GRO-UP",
                "no_events_this_day": "В этот день событий нет", "loading": "Загрузка...",
                "dow_1": "ПН", "dow_2": "ВТ", "dow_3": "СР", "dow_4": "ЧТ", "dow_5": "ПТ", "dow_6": "СБ", "dow_7": "ВС",
                "months": ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"]
            },
            cs: {
                "archive_title": "Události", "back_home": "Na hlavní stránku", "btn_back": "Zpět",
                "group_short": "Sk.", "leader_short": "Ved:", "full_calendar_title": "Kalendář - GRO-UP",
                "no_events_this_day": "V tento den nejsou žádné události", "loading": "Načítání...",
                "dow_1": "PO", "dow_2": "ÚT", "dow_3": "ST", "dow_4": "ČT", "dow_5": "PÁ", "dow_6": "SO", "dow_7": "NE",
                "months": ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"]
            }
        };

        const currentLang = localStorage.getItem('app_lang') || 'ru';
        window.t = (key) => dict[currentLang][key] || key;

        const applyTranslations = () => {
            document.querySelectorAll('[data-lang]').forEach(el => el.innerHTML = window.t(el.getAttribute('data-lang')));
            document.querySelectorAll('[data-lang-title]').forEach(el => el.setAttribute('title', window.t(el.getAttribute('data-lang-title'))));
        };

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyTranslations);
        else applyTranslations();

        const firebaseConfig = {
            apiKey: "AIzaSyCwflIUs2AnBRIIxrssVpbpykHwG2436q0",
            authDomain: "gro-uping.firebaseapp.com",
            projectId: "gro-uping",
            storageBucket: "gro-uping.firebasestorage.app",
            messagingSenderId: "819938349545",
            appId: "1:819938349545:web:a00c3bef66d99f5b6cfb78"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'index.html';

        const monthsNames = dict[currentLang].months;
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); 
        let selectedDay = null; 
        
        let allEvents = {}; 

        setTimeout(() => {
            document.getElementById('global-loader').style.opacity = '0';
            setTimeout(() => document.getElementById('global-loader').style.display = 'none', 500);
        }, 1500);

        window.changeYear = (dir) => {
            currentYear += dir;
            document.getElementById('display-year').innerText = currentYear;
            selectedDay = null;
            renderMonths();
            renderDays();
            renderSelectedEvents();
        };

        window.selectMonth = (mIdx) => {
            currentMonth = mIdx;
            const now = new Date();
            if (currentYear === now.getFullYear() && currentMonth === now.getMonth()) selectedDay = now.getDate();
            else selectedDay = 1;

            renderMonths();
            renderDays();
            renderSelectedEvents();
        };

        window.selectDay = (d) => {
            selectedDay = d;
            renderDays();
            renderSelectedEvents();
        };

        function renderMonths() {
            const grid = document.getElementById('months-grid');
            let html = '';
            for (let i = 0; i < 12; i++) {
                const isSelected = (i === currentMonth);
                const bgClass = isSelected ? 'bg-slate-800 text-white' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-50';
                
                html += `
                    <button onclick="selectMonth(${i})" class="${bgClass} aspect-square rounded-md flex items-center justify-center font-black text-[9px] md:text-xs uppercase tracking-widest transition-colors outline-none w-full">
                        ${monthsNames[i].substring(0,3)}
                    </button>
                `;
            }
            grid.innerHTML = html;
        }

        function renderDays() {
            const grid = document.getElementById('days-grid');
            grid.innerHTML = '';
            
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const shift = firstDay === 0 ? 6 : firstDay - 1; 
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const now = new Date();

            for (let i = 0; i < shift; i++) { grid.innerHTML += `<div></div>`; }

            for (let d = 1; d <= totalDays; d++) {
                const dateObj = new Date(currentYear, currentMonth, d);
                const dow = dateObj.getDay();
                const isWeekend = (dow === 0 || dow === 6); // Суббота или Воскресенье
                const isToday = (d === now.getDate() && currentMonth === now.getMonth() && currentYear === now.getFullYear());
                const isSelected = (d === selectedDay);
                const dayEvents = (allEvents[currentYear] && allEvents[currentYear][currentMonth] && allEvents[currentYear][currentMonth][d]) || [];
                
                const hasSpecial = dayEvents.some(e => e.isSpecial);
                const hasNormal = dayEvents.length > 0;

                let dotHtml = '';
                if (hasNormal) {
                    // Если особое событие — красная точка, иначе голубая
                    const dotColor = hasSpecial ? 'bg-rose-500' : 'bg-sky-500';
                    dotHtml = `<div class="w-1.5 h-1.5 rounded-full ${dotColor} absolute bottom-1 shadow-sm"></div>`;
                }

                // Логика покраски плиток
                let bgClass = 'bg-slate-50 border-slate-100 text-slate-700 hover:bg-slate-100'; // Обычный день
                
                if (isSelected) {
                    bgClass = 'bg-slate-800 border-slate-800 text-white shadow-inner';
                } else if (isToday) {
                    bgClass = 'bg-white border-emerald-500 text-emerald-600';
                } else if (hasSpecial) {
                    bgClass = 'bg-emerald-100 border-emerald-300 text-emerald-800 hover:bg-emerald-200'; // Особое событие
                } else if (isWeekend) {
                    bgClass = 'bg-slate-200 border-slate-300 text-slate-800 hover:bg-slate-300'; // Выходные чуть темнее
                }

                grid.innerHTML += `
                    <button onclick="selectDay(${d})" class="rounded-md border flex flex-col items-center justify-center text-xs md:text-sm font-black relative cursor-pointer transition-colors outline-none w-full h-full ${bgClass}">
                        ${d}
                        ${dotHtml}
                    </button>
                `;
            }
        }

        function renderSelectedEvents() {
            const list = document.getElementById('events-panel-list');
            const title = document.getElementById('selected-date-title');
            
            if (!selectedDay) {
                title.innerText = window.t('archive_title');
                list.innerHTML = `<p class="text-[10px] text-slate-400 text-center italic py-4">Выберите день</p>`;
                return;
            }

            title.innerText = `${selectedDay} ${monthsNames[currentMonth]} ${currentYear}`;
            const dayEvents = (allEvents[currentYear] && allEvents[currentYear][currentMonth] && allEvents[currentYear][currentMonth][selectedDay]) || [];

            if (dayEvents.length === 0) {
                list.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full opacity-50 py-4">
                        <svg class="w-6 h-6 text-slate-400 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">${window.t('no_events_this_day')}</p>
                    </div>
                `;
                return;
            }

            let html = '';
            dayEvents.forEach(ev => {
                // Карточки темные (bg-slate-800), плашка группы темно-серая (bg-slate-700)
                const groupHtml = ev.group !== "Все" && ev.group !== "Všechny" ? `<span class="text-[8px] font-bold text-slate-300 uppercase tracking-widest border border-slate-600 bg-slate-700 px-1.5 py-0.5 rounded">${window.t('group_short')} ${ev.group}</span>` : '';
                html += `
                    <div class="flex flex-col p-3 bg-slate-800 border border-slate-700 rounded-md shadow-sm">
                        <div class="flex justify-between items-start mb-1.5 gap-2">
                            <span class="font-black text-white text-xs md:text-sm leading-tight">${ev.title} ${ev.isSpecial ? '⭐' : ''}</span>
                            ${groupHtml}
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] md:text-xs font-mono font-bold text-slate-400">${ev.time || ''}</span>
                            ${ev.leader ? `<span class="text-[9px] uppercase font-bold text-emerald-400 tracking-widest">${window.t('leader_short')} ${ev.leader}</span>` : ''}
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        const q = query(collection(db, "events"), orderBy("date", "asc"));
        onSnapshot(q, (snapshot) => {
            allEvents = {};
            snapshot.forEach(docSnap => {
                const ev = docSnap.data();
                if (!ev.date) return;
                const parts = ev.date.split('-');
                if (parts.length < 3) return;

                const y = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10) - 1; 
                const d = parseInt(parts[2], 10);

                if (!allEvents[y]) allEvents[y] = {};
                if (!allEvents[y][m]) allEvents[y][m] = {};
                if (!allEvents[y][m][d]) allEvents[y][m][d] = [];

                allEvents[y][m][d].push(ev);
            });
            
            const now = new Date();
            if (selectedDay === null && currentYear === now.getFullYear() && currentMonth === now.getMonth()) {
                selectedDay = now.getDate();
            }

            renderDays();
            renderSelectedEvents();
        });

        document.getElementById('display-year').innerText = currentYear;
        renderMonths();
    </script>
</body>
</html>
