<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-lang="duties_title">График Дежурств - GRO-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ui: { bg: '#f8fafc', adminNav: '#1e1b4b' } } } } }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white text-slate-800 min-h-[100dvh] font-sans pb-10 overflow-x-hidden w-full">

    <header class="fixed top-0 left-0 w-full bg-white/90 backdrop-blur-md border-b border-slate-100 z-50 flex items-center px-4 h-14">
        <a href="index.html" class="p-2 -ml-2 text-slate-400 hover:text-slate-800 transition-colors outline-none rounded-full active:bg-slate-100">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
        </a>
        <h1 class="text-lg font-black text-slate-800 ml-2 tracking-wide" data-lang="duties_h1">График дежурств</h1>
    </header>

    <main class="w-full max-w-2xl mx-auto pt-20 px-4 md:px-0">
        
        <div class="mb-8">
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2" data-lang="assign_title">
                Назначить
            </h2>
            
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 flex flex-col gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5" data-lang="duty_type_label">Тип дежурства</label>
                    <select id="duty-type" class="w-full bg-white border border-slate-200 rounded-xl p-3.5 text-sm outline-none focus:border-slate-400 font-bold text-slate-700 appearance-none">
                        <option value="Уборка зала" data-lang="opt_cleaning">Уборка зала</option>
                        <option value="Специальное событие" data-lang="opt_special_event">Специальное событие</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5" data-lang="start_group_label">Группа (можно 1, 2)</label>
                    <input type="text" id="duty-group" data-lang-placeholder="ph_group_example" placeholder="Например: 1, 2" class="w-full bg-white border border-slate-200 rounded-xl p-3.5 text-sm outline-none focus:border-slate-400 font-bold text-slate-700">
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5" data-lang="start_monday_label">С понедельника (Дата начала)</label>
                    <input type="date" id="duty-date" class="w-full bg-white border border-slate-200 rounded-xl p-3.5 text-sm outline-none focus:border-slate-400 font-bold text-slate-700 cursor-pointer">
                </div>

                <div class="mt-2">
                    <label class="flex items-center gap-3 cursor-pointer mb-2 p-2 -ml-2 rounded-lg active:bg-slate-100 transition-colors w-max">
                        <input type="checkbox" id="duty-recurring" class="w-5 h-5 accent-slate-800 rounded cursor-pointer" onchange="document.getElementById('weeks-container').classList.toggle('hidden')">
                        <span class="text-xs font-bold text-slate-700 uppercase tracking-wide mt-0.5" data-lang="auto_distribute">Авто-раскидать на месяц</span>
                    </label>
                    <div id="weeks-container" class="hidden flex items-center justify-between gap-4 mt-2 bg-white p-3 rounded-xl border border-slate-200">
                        <span class="text-xs text-slate-500 font-bold" data-lang="how_many_weeks">На сколько недель?</span>
                        <input type="number" id="duty-weeks" value="4" min="2" max="12" class="w-20 p-2 text-center font-black text-slate-800 bg-slate-50 rounded-lg border border-slate-200 outline-none focus:border-slate-400">
                    </div>
                </div>

                <button id="save-duty-btn" data-lang="btn_assign" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl transition-colors active:bg-slate-700 mt-2 text-xs uppercase tracking-widest outline-none">
                    Назначить
                </button>
            </div>
        </div>

        <div>
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2" data-lang="current_schedule">
                Текущий график
            </h2>
            <div id="duties-list" class="bg-white rounded-2xl border border-slate-200 flex flex-col overflow-hidden min-h-[100px]">
                <p class="text-slate-400 italic p-6 text-center text-sm" data-lang="loading">Загрузка...</p>
            </div>
        </div>

    </main>

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-[200] flex flex-col gap-2 pointer-events-none"></div>
    <script type="module" src="duties.js?v=200"></script>
</body>
</html>
