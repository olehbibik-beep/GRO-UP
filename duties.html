<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-512.png" type="image/png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="theme-color" content="#0f172a">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GRO-UP">
    <title data-lang="duties_title">График Дежурств - GRO-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ui: {
                            bg: '#E1E1EB',
                            nav: '#2A2E33',
                            report: '#0f172a',
                            news: '#0ea5e9',
                            success: '#2dd4bf'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-ui-bg text-slate-800 min-h-screen font-sans overflow-x-hidden w-full relative">

    <nav class="fixed top-0 left-0 w-full bg-ui-nav flex flex-row items-center justify-start z-50 pt-safe border-b-[3px] border-[#2A2E33]">
        <a href="index.html" data-lang-title="back_home" class="flex items-center justify-center p-3 outline-none transition-colors text-slate-500 hover:text-white" title="Назад">
            <svg class="w-7 h-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
        </a>
    </nav>

    <main class="w-full max-w-5xl mx-auto px-4 pt-16 pb-6">
        
        <div class="mb-6 flex justify-between items-center bg-transparent">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center shrink-0">
                    <svg class="w-5 h-5 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-slate-800 leading-tight" data-lang="duties_h1">График</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-0.5" data-lang="manage_duties">Управление дежурствами</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-5 rounded-2xl border border-slate-200 mb-6">
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-5 flex items-center gap-2" data-lang="assign_title">
                Назначить
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-start">
                
                <div class="md:col-span-3">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5" data-lang="duty_type_label">Тип дежурства</label>
                    <select id="duty-type" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-slate-400 font-bold text-slate-700 appearance-none">
                        <option value="Уборка зала" data-lang="opt_cleaning">Уборка зала</option>
                        <option value="Специальное событие" data-lang="opt_special_event">Специальное событие</option>
                    </select>
                </div>

                <div class="md:col-span-3">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5" data-lang="start_group_label">Группа (можно 1, 2)</label>
                    <input type="text" id="duty-group" data-lang-placeholder="ph_group_example" placeholder="Например: 1, 2" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-slate-400 font-bold text-slate-700">
                </div>
                
                <div class="md:col-span-3">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5" data-lang="start_monday_label">С понедельника (Дата)</label>
                    <input type="date" id="duty-date" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-slate-400 font-bold text-slate-700 cursor-pointer">
                </div>

                <div class="md:col-span-3 flex flex-col justify-end h-full">
                    <div class="mb-3 pt-1">
                        <label class="flex items-center gap-3 cursor-pointer w-max p-2 -ml-2 rounded-lg active:bg-slate-50 transition-colors">
                            <input type="checkbox" id="duty-recurring" class="w-5 h-5 accent-slate-800 rounded cursor-pointer" onchange="document.getElementById('weeks-container').classList.toggle('hidden')">
                            <span class="text-[11px] font-black text-slate-600 uppercase tracking-widest mt-0.5" data-lang="auto_distribute">Авто-раскидать</span>
                        </label>
                        <div id="weeks-container" class="hidden flex items-center justify-between gap-2 mt-1 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                            <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest" data-lang="how_many_weeks">Недель?</span>
                            <input type="number" id="duty-weeks" value="4" min="2" max="12" class="w-16 p-2 text-center font-black text-slate-800 bg-white rounded-lg border border-slate-200 outline-none focus:border-slate-400">
                        </div>
                    </div>
                    <button id="save-duty-btn" data-lang="btn_assign" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition-colors active:bg-slate-700 text-xs uppercase tracking-widest outline-none">
                        Назначить
                    </button>
                </div>

            </div>
        </div>

        <div>
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2" data-lang="current_schedule">
                Текущий график
            </h2>
            <div id="duties-list" class="bg-white rounded-2xl border border-slate-200 flex flex-col overflow-hidden min-h-[150px]">
                <p class="text-slate-400 italic p-6 text-center text-sm" data-lang="loading">Загрузка...</p>
            </div>
        </div>

    </main>

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-[200] flex flex-col gap-2 pointer-events-none"></div>
    <script type="module" src="duties.js?v=203"></script>
</body>
</html>
