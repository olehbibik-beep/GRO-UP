<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-lang="admin_title">Панель Администратора</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ui: { bg: '#f1f5f9', adminNav: '#1e1b4b' } } } } }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        
        /* Стили для плавного открытия аккордеона */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary ~ * { animation: sweep .2s ease-in-out; }
        @keyframes sweep { 0% {opacity: 0; transform: translateY(-5px)} 100% {opacity: 1; transform: translateY(0)} }
    </style>
</head>
<body class="bg-ui-bg text-slate-800 min-h-screen font-sans">

    <nav class="fixed bottom-0 left-0 w-full bg-ui-adminNav flex flex-row items-center justify-center z-50 md:top-0 md:h-screen md:w-20 md:flex-col md:justify-start md:py-6 pb-safe border-t border-indigo-900 md:border-t-0 no-print">
        <a href="index.html" data-lang-title="back_home" class="nav-btn group flex flex-col items-center justify-center flex-1 py-3 md:flex-none md:w-full outline-none transition-colors">
            <div class="nav-icon-container text-indigo-300 hover:text-white p-2.5 rounded-full transition-colors flex flex-col items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6 md:w-7 md:h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
                <span class="text-[8px] font-black uppercase tracking-widest hidden md:block" data-lang="btn_back">Назад</span>
            </div>
        </a>
    </nav>

    <main class="w-full max-w-[1400px] mx-auto px-4 py-6 md:pl-28 md:pr-6 pb-24">
        
        <div class="mb-6 flex flex-col md:flex-row justify-between items-start bg-white p-5 rounded-2xl shadow-sm border border-slate-200 gap-6">
            <div>
                <h1 class="text-2xl font-black text-indigo-600 mb-1" data-lang="users_title">Пользователи</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest" data-lang="autosave_data">Автосохранение данных</p>
            </div>
            
            <div class="w-full md:w-auto grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col md:col-span-2">
                    <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 pl-1" data-lang="cong_name_label">Название собрания (Увидят все)</label>
                    <input type="text" id="congregation-name" data-lang-placeholder="cong_name_placeholder" onchange="updateCongregation(this.value)" placeholder="Например: Центральное" class="w-full text-sm font-black text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-lg p-2.5 outline-none focus:border-indigo-400 shadow-sm transition-colors">
                </div>
                
                <div class="flex flex-col">
                    <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 pl-1">ZOOM ID</label>
                    <input type="text" id="zoom-id" onchange="updateZoomData('zoomId', this.value)" placeholder="000 000 0000" class="w-full text-sm font-black text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-lg p-2.5 outline-none focus:border-emerald-400 shadow-sm transition-colors">
                </div>
                
                <div class="flex flex-col">
                    <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 pl-1">ZOOM Password</label>
                    <input type="text" id="zoom-pass" onchange="updateZoomData('zoomPass', this.value)" placeholder="123456" class="w-full text-sm font-black text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-lg p-2.5 outline-none focus:border-emerald-400 shadow-sm transition-colors">
                </div>
            </div>
        </div>

        <section class="mb-8">
            <h2 class="text-sm font-bold flex items-center gap-2 mb-3 uppercase tracking-widest text-slate-500">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span data-lang="requests_title">Заявки</span> (<span id="pending-count">0</span>)
            </h2>
            <div class="bg-white rounded-xl shadow-sm border border-amber-100 overflow-hidden">
                <div id="pending-list" class="divide-y divide-slate-50"></div>
            </div>
        </section>

        <section class="mb-8">
            <div class="flex justify-between items-end mb-3">
                <h2 class="text-sm font-bold uppercase tracking-widest text-slate-500"><span data-lang="active_users">Активные</span> (<span id="active-count">0</span>)</h2>
                <input type="text" id="search-user" data-lang-placeholder="search_placeholder" placeholder="Поиск..." class="p-2 px-4 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 w-64 text-sm font-medium bg-white shadow-sm">
            </div>
            
            <div id="groups-container" class="space-y-3">
                </div>
        </section>

        <section class="mt-12 bg-slate-800 rounded-xl p-5 shadow-lg border border-slate-700">
            <h2 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                Журнал изменений (Логи)
            </h2>
            <div id="logs-list" class="space-y-2 max-h-48 overflow-y-auto custom-scrollbar pr-2">
                <p class="text-[10px] text-slate-500 italic">Загрузка логов...</p>
            </div>
        </section>
    </main>

    <div id="msg-modal" class="fixed inset-0 bg-slate-900/60 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm" onclick="closeMsgModal()">
        <div class="bg-white w-full max-w-sm rounded-xl p-6 relative shadow-2xl flex flex-col" onclick="event.stopPropagation()">
            <h2 class="text-lg font-black text-slate-800 mb-1" data-lang="send_msg">Отправить сообщение</h2>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Для: <span id="msg-user-name" class="text-indigo-600"></span></p>
            <input type="hidden" id="msg-user-id">
            <textarea id="msg-text" rows="3" class="w-full border border-slate-300 rounded-lg p-3 text-sm font-medium text-slate-700 outline-none focus:border-indigo-500 shadow-sm mb-4" placeholder="Введите текст сообщения..."></textarea>
            <div class="flex gap-2">
                <button onclick="closeMsgModal()" class="w-1/3 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-lg text-xs uppercase tracking-widest transition-colors hover:bg-slate-200">Отмена</button>
                <button onclick="sendMsg()" id="send-msg-btn" class="w-2/3 bg-indigo-600 text-white font-bold py-2.5 rounded-lg text-xs uppercase tracking-widest transition-colors hover:bg-indigo-700 shadow-sm">Отправить</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-[150] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module" src="admin.js?v=80"></script>
</body>
</html>
