<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-512.png" type="image/png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="theme-color" content="#0f172a">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GRO-UP">
    <title data-lang="admin_title">Панель Администратора - GRO-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ui: { bg: '#f8fafc', adminNav: '#0f172a' } } } } }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar { display: none; }
        .text-center-last { text-align-last: center; }
    </style>
</head>
<body class="bg-ui-bg text-slate-800 min-h-screen font-sans pb-24 md:pb-0 overflow-x-hidden w-full">

    <nav class="fixed bottom-0 left-0 w-full bg-ui-adminNav flex flex-row items-center justify-center z-50 md:top-0 md:h-screen md:w-20 md:flex-col md:justify-start md:py-6 pt-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] border-t border-slate-800 md:border-t-0">
        <a href="index.html" data-lang-title="back_home" class="nav-btn group flex flex-col items-center justify-center flex-1 py-3 md:flex-none md:w-full outline-none transition-colors">
            <div class="nav-icon-container text-slate-400 hover:text-white p-2.5 rounded-full transition-colors flex flex-col items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6 md:w-7 md:h-7">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />
                </svg>
                <span class="text-[8px] font-black uppercase tracking-widest hidden md:block mt-1" data-lang="btn_back">Назад</span>
            </div>
        </a>
    </nav>

    <main class="w-full max-w-7xl mx-auto pt-6 px-4 md:pl-28 md:pr-6">
        
        <div class="mb-6 flex justify-between items-center bg-transparent">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center shrink-0 text-indigo-600">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-slate-800 leading-tight" data-lang="users_title">Пользователи</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-0.5" data-lang="autosave_data">Автосохранение данных</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-5 rounded-2xl border border-slate-200 mb-8 flex flex-col md:flex-row gap-4 justify-between items-start md:items-center shadow-sm">
            <div class="w-full md:w-1/2">
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5" data-lang="cong_name_label">Название собрания (Увидят все)</label>
                <input type="text" id="congregation-name" onchange="updateCongregation(this.value)" data-lang-placeholder="cong_name_placeholder" placeholder="Например: Центральное" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-indigo-400 font-bold text-slate-700 transition-colors">
            </div>
            <div class="w-full md:w-1/2 flex gap-4">
                <div class="w-full">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">ZOOM ID</label>
                    <input type="text" id="zoom-id" onchange="updateZoomData('zoomId', this.value)" placeholder="000 000 0000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-indigo-400 font-bold text-slate-700 font-mono transition-colors">
                </div>
                <div class="w-full">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">ZOOM PASSWORD</label>
                    <input type="text" id="zoom-pass" onchange="updateZoomData('zoomPass', this.value)" placeholder="123456" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-indigo-400 font-bold text-slate-700 font-mono transition-colors">
                </div>
            </div>
        </div>

        <div class="mb-8">
            <h2 class="text-sm font-black text-amber-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-amber-500"></div>
                <span data-lang="requests_title">Заявки</span> ( <span id="pending-count">0</span> )
            </h2>
            <div id="pending-list" class="bg-white rounded-2xl border border-slate-200 flex flex-col overflow-hidden shadow-sm">
                <p class="text-slate-400 text-xs text-center py-4 font-bold uppercase tracking-widest">Загрузка...</p>
            </div>
        </div>

        <div class="mt-8 mb-4">
            <h2 class="text-sm font-black text-emerald-500 uppercase tracking-widest mb-3 flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                <span data-lang="active_users">Активные пользователи</span>
            </h2>
            
            <div class="flex flex-wrap gap-x-6 gap-y-3 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm text-slate-800 font-bold">
                <div class="flex items-center gap-2">
                    <span class="text-slate-500 uppercase tracking-widest text-[10px]">Всего:</span> 
                    <span id="stat-total" class="text-xl">0</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-slate-500 uppercase tracking-widest text-[10px]">Возвещатели:</span> 
                    <span id="stat-pub" class="text-xl">0</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-slate-500 uppercase tracking-widest text-[10px]">Пионеры:</span> 
                    <span id="stat-pio" class="text-xl">0</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-slate-500 uppercase tracking-widest text-[10px]">Старейшины:</span> 
                    <span id="stat-eld" class="text-xl">0</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-slate-500 uppercase tracking-widest text-[10px]">Помощники:</span> 
                    <span id="stat-ms" class="text-xl">0</span>
                </div>
            </div>

            <div class="flex flex-row gap-2 mb-4">
                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </div>
                    <input type="text" id="search-user" data-lang-placeholder="search_placeholder" placeholder="Поиск..." class="w-full bg-white border border-slate-200 rounded-lg py-2 pl-9 pr-3 text-xs font-bold text-slate-700 outline-none focus:border-indigo-500 shadow-sm transition-colors">
                </div>
                <select id="filter-group" class="bg-white border border-slate-200 rounded-lg py-2 px-3 text-xs font-bold text-slate-700 outline-none focus:border-indigo-500 shadow-sm transition-colors w-28 md:w-48 shrink-0 appearance-none cursor-pointer">
                    <option value="all">Все группы</option>
                </select>
            </div>

            <div id="users-list-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
                </div>
        </div>

        <div class="mt-8 mb-8 bg-slate-800 p-5 rounded-2xl border border-slate-700 flex flex-col max-h-64 overflow-y-auto custom-scrollbar shadow-lg">
            <h3 class="text-xs font-black text-slate-300 uppercase tracking-widest mb-3 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                Журнал изменений (ЛОГИ)
            </h3>
            <div id="logs-list" class="space-y-2">
                <p class="text-[10px] text-slate-500 italic">Загрузка логов...</p>
            </div>
        </div>

    </main>

    <div id="msg-modal" class="fixed inset-0 bg-slate-900/60 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm" onclick="closeMsgModal()">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 relative flex flex-col shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-black text-slate-800" data-lang="send_msg">Отправить сообщение</h2>
                <button onclick="closeMsgModal()" class="text-slate-400 hover:text-slate-600 bg-slate-100 hover:bg-slate-200 w-8 h-8 rounded-full flex items-center justify-center transition-colors outline-none font-black text-lg pb-1">×</button>
            </div>
            <p id="msg-user-name" class="text-xs font-bold text-indigo-600 mb-3 uppercase tracking-widest bg-indigo-50 p-2 rounded-lg text-center"></p>
            <input type="hidden" id="msg-user-id">
            <textarea id="msg-text" rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-indigo-400 font-medium text-slate-700 resize-none mb-4 custom-scrollbar" placeholder="Введите текст..."></textarea>
            <button id="send-msg-btn" onclick="sendMsg()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors active:bg-indigo-800 text-xs uppercase tracking-widest outline-none">
                Отправить
            </button>
        </div>
    </div>

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-[200] flex flex-col gap-2 pointer-events-none"></div>
    <script type="module" src="admin.js?v=208"></script>

</body>
</html>
