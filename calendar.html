<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-lang="calendar_title">Календарь встреч</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ui: { bg: '#cbd5e1', nav: '#0f172a' } } } } }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-ui-bg text-slate-800 min-h-screen font-sans pb-20 md:pb-0">

    <div id="global-loader" class="fixed inset-0 bg-ui-bg z-[200] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-slate-300 border-t-slate-800 mb-4"></div>
        <p class="text-[10px] font-bold text-slate-400 tracking-widest uppercase animate-pulse" data-lang="loading">Загрузка...</p>
    </div>

    <nav class="fixed bottom-0 left-0 w-full bg-ui-nav flex flex-row items-center justify-center z-50 md:top-0 md:h-screen md:w-20 md:flex-col md:justify-start md:py-6 pb-safe border-t border-slate-800 md:border-t-0 no-print">
        <a href="index.html" class="flex flex-col items-center justify-center py-4 w-full md:flex-none md:mb-4 outline-none transition-colors text-slate-400 hover:text-white" title="Назад">
            <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
        </a>
    </nav>

    <main class="w-full max-w-4xl mx-auto px-4 py-6 md:pl-28 md:pr-6">
        
        <div class="mb-6 flex justify-between items-center bg-white p-5 rounded-md shadow-sm border border-slate-200">
            <h1 class="text-xl md:text-2xl font-black text-slate-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <span data-lang="calendar_title">Календарь встреч</span>
            </h1>
        </div>

        <div class="bg-white rounded-md shadow-sm border border-slate-200 overflow-hidden p-4 mb-6">
            <form id="add-event-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1" data-lang="date">Дата</label>
                        <input type="date" id="event-date" required class="w-full bg-slate-50 border border-slate-200 rounded-md p-2 outline-none focus:border-indigo-400 font-bold text-slate-700">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1" data-lang="time">Время</label>
                        <input type="time" id="event-time" required class="w-full bg-slate-50 border border-slate-200 rounded-md p-2 outline-none focus:border-indigo-400 font-bold text-slate-700">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1" data-lang="event_name">Название</label>
                    <input type="text" id="event-title" required class="w-full bg-slate-50 border border-slate-200 rounded-md p-2 outline-none focus:border-indigo-400 font-bold text-slate-700" data-lang-placeholder="event_name_placeholder">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1" data-lang="leader">Проводит</label>
                        <input type="text" id="event-leader" list="brothers-list" autocomplete="off" class="w-full bg-slate-50 border border-slate-200 rounded-md p-2 outline-none focus:border-indigo-400 font-bold text-slate-700">
                        <datalist id="brothers-list"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1" data-lang="group">Группа</label>
                        <select id="event-group" class="w-full bg-slate-50 border border-slate-200 rounded-md p-2 outline-none focus:border-indigo-400 font-bold text-slate-700">
                            <option value="Все" data-lang="all_groups">Все</option>
                            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center gap-4 bg-slate-50 p-3 rounded-md border border-slate-100 mt-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="event-special" class="w-4 h-4 accent-indigo-500">
                        <span class="text-xs font-bold text-slate-700 uppercase tracking-widest" data-lang="special_event">Особое событие</span>
                    </label>
                </div>
                <div class="flex items-center gap-4 bg-red-50 p-3 rounded-md border border-red-100 mt-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="repeat-weekly" class="w-4 h-4 accent-red-500">
                        <span class="text-xs font-bold text-red-700 uppercase tracking-widest" data-lang="repeat_weekly">Повторять еженедельно (12 нед.)</span>
                    </label>
                </div>
                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-black py-3 rounded-md text-xs uppercase tracking-widest outline-none transition-colors shadow-sm" data-lang="publish">Опубликовать</button>
            </form>
        </div>

        <div class="bg-white rounded-md shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="font-black text-slate-800 text-base md:text-lg" data-lang="schedule_title">Расписание встреч</h2>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="show-all-groups" onchange="window.forceRenderEvents()" class="w-4 h-4 accent-indigo-500">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest" data-lang="show_other_groups">Другие группы</span>
                </label>
            </div>
            <div id="events-list" class="divide-y divide-slate-100"></div>
        </div>
    </main>
    
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-[100] flex flex-col gap-2 pointer-events-none"></div>
    <script type="module" src="calendar.js?v=65"></script>
</body>
</html>
