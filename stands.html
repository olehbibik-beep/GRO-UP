<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-lang="stands_title">Служение со стендом</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ui: { bg: '#f8fafc' } } } } }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { display: block; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .date-chip.active { background-color: #1e293b; color: white; border-color: #1e293b; }
        .date-chip.active .date-day { color: #94a3b8; }
        .loc-btn.active { background-color: #1e293b; color: white; border-color: #1e293b; }
    </style>
</head>
<body class="bg-ui-bg text-slate-800 min-h-screen font-sans pb-12">

    <nav class="fixed top-0 left-0 w-full bg-white border-b border-slate-200 flex items-center h-14 z-50 px-4">
        <a href="index.html" class="flex items-center text-slate-500 hover:text-slate-800 transition-colors outline-none font-bold text-sm gap-2">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            <span data-lang="btn_back">Назад</span>
        </a>
        <h1 class="mx-auto font-black text-slate-800 absolute left-1/2 -translate-x-1/2 flex items-center gap-2">
            <svg class="w-5 h-5 text-slate-800" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
            <span data-lang="stands_title">Стенды</span>
        </h1>
    </nav>

    <main class="w-full max-w-4xl mx-auto pt-20 px-4">
        
        <div class="mb-6 flex gap-2 overflow-x-auto custom-scrollbar pb-2 snap-x">
            <button onclick="selectLocation('ML - CupVital')" id="loc-ML-CupVital" class="loc-btn active shrink-0 px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-md text-xs md:text-sm font-black transition-colors outline-none snap-center">ML - CupVital</button>
            <button onclick="selectLocation('ML - Chebská')" id="loc-ML-Chebská" class="loc-btn shrink-0 px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-md text-xs md:text-sm font-black transition-colors outline-none snap-center">ML - Chebská</button>
            <button onclick="selectLocation('Tachov')" id="loc-Tachov" class="loc-btn shrink-0 px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-md text-xs md:text-sm font-black transition-colors outline-none snap-center">Tachov</button>
        </div>

        <div class="mb-4 relative group">
            <button onclick="scrollDates(-200)" class="hidden md:flex absolute left-0 top-1/2 -translate-y-1/2 z-10 bg-white/90 text-slate-700 border border-slate-200 rounded-md w-8 h-10 items-center justify-center outline-none hover:bg-slate-50 -ml-4">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            </button>
            
            <div id="dates-container" class="flex overflow-x-auto gap-2 pb-2 snap-x snap-mandatory custom-scrollbar scroll-smooth"></div>

            <button onclick="scrollDates(200)" class="hidden md:flex absolute right-0 top-1/2 -translate-y-1/2 z-10 bg-white/90 text-slate-700 border border-slate-200 rounded-md w-8 h-10 items-center justify-center outline-none hover:bg-slate-50 -mr-4">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
            </button>
        </div>

        <div class="flex items-center justify-between mb-2 px-1">
            <h2 id="selected-date-display" class="font-black text-slate-700 text-base md:text-lg truncate pr-2">...</h2>
            <div class="flex gap-2 text-[8px] md:text-[9px] font-bold uppercase tracking-widest text-slate-400 shrink-0">
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 block"></span>Свободно</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-slate-800 block"></span>Твоё</span>
            </div>
        </div>

        <div class="bg-white rounded-md border border-slate-200 overflow-hidden mb-6">
            <div class="flex bg-slate-50 border-b border-slate-200 p-3 text-[10px] md:text-xs font-black text-slate-500 uppercase tracking-widest text-center">
                <div class="w-1/4" data-lang="time_label">Время</div>
                <div class="w-3/8 flex-grow border-l border-slate-200" data-lang="pub_1">Возв. 1</div>
                <div class="w-3/8 flex-grow border-l border-slate-200" data-lang="pub_2">Возв. 2</div>
            </div>
            <div id="slots-container" class="divide-y divide-slate-100 flex flex-col">
                <p class="text-center py-10 text-slate-400 italic text-sm" data-lang="loading">Загрузка...</p>
            </div>
        </div>
        
    </main>

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-[100] flex flex-col gap-2 pointer-events-none"></div>
    <script type="module" src="stands.js?v=21"></script>
</body>
</html>
