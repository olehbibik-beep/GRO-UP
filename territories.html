<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-512.png" type="image/png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="theme-color" content="#0f172a">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GRO-UP">
    
    <title data-lang="terr_title">Управление Участками - GRO-UP</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ui: { bg: '#f3f4f6', adminNav: '#1e1b4b' } } } } }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 8px; }
        
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary ~ * { animation: sweep .2s ease-in-out; }
        @keyframes sweep { 0% {opacity: 0; transform: translateY(-5px)} 100% {opacity: 1; transform: translateY(0)} }

        /* Фикс для карты поверх модального окна */
        .leaflet-container { z-index: 10; font-family: inherit; }
        .leaflet-control-container { z-index: 20; }
    </style>
</head>
<body class="bg-ui-bg text-slate-800 min-h-screen font-sans">

    <nav class="fixed bottom-0 left-0 w-full bg-ui-adminNav flex flex-row items-center justify-center z-50 md:top-0 md:h-screen md:w-20 md:flex-col md:justify-start md:py-6 pb-safe border-t border-indigo-900 md:border-t-0 no-print">
        <a href="index.html" data-lang-title="back_home" class="nav-btn group flex flex-col items-center justify-center flex-1 py-3 md:flex-none md:w-full outline-none transition-colors">
            <div class="nav-icon-container text-indigo-300 hover:text-white p-2.5 rounded-full transition-colors flex flex-col items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6 md:w-7 md:h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
                <span class="text-[8px] font-black uppercase tracking-widest hidden md:block" data-lang="btn_back">Назад</span>
            </div>
        </a>
    </nav>

    <main class="w-full max-w-[1400px] mx-auto pt-4 md:pt-6 px-4 pb-24 md:pl-28 md:pr-6">
        
        <div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-5 rounded-2xl border border-slate-200 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center shrink-0 border border-emerald-100">
                    <svg class="w-6 h-6 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" /></svg>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-slate-800" data-lang="terr_h1">Участки</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-0.5" data-lang="manage_terr">Управление территориями</p>
                </div>
            </div>
            
            <button onclick="openMapsModal()" class="w-full md:w-auto flex items-center justify-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-3 rounded-xl transition-colors font-bold text-xs uppercase tracking-widest outline-none shadow-sm border border-slate-200">
                <svg class="w-4 h-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span data-lang="btn_map_db">База карт</span>
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-5 md:p-6 rounded-2xl border border-slate-200 sticky top-6">
                    <h2 class="text-lg font-black text-slate-800 mb-5 flex items-center gap-2">
                        <svg class="w-5 h-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
                        <span data-lang="issue_terr">Выдать участок</span>
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 pl-1" data-lang="to_whom">Кому выдать</label>
                            <select id="user-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-emerald-400 font-bold text-slate-700 cursor-pointer">
                                <option value="" disabled selected data-lang="loading">Загрузка...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 pl-1" data-lang="terr_number_label">Номер участка</label>
                            <input type="number" id="territory-number" data-lang-placeholder="ph_terr_num" placeholder="Например: 105" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:border-emerald-400 font-black font-mono text-lg text-emerald-700 text-center">
                        </div>
                        <button id="assign-btn" data-lang="btn_assign" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl transition-colors mt-2 text-xs uppercase tracking-widest outline-none">
                            Назначить
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                
                <div>
                    <div class="flex justify-between items-end mb-3">
                        <h2 class="text-sm font-bold uppercase tracking-widest text-slate-500 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span data-lang="in_progress">В работе</span>
                        </h2>
                        <input type="text" id="search-terr" data-lang-placeholder="ph_search_terr" placeholder="Поиск..." class="p-2 px-4 border border-slate-200 rounded-xl outline-none focus:border-emerald-500 w-48 md:w-64 text-sm font-medium bg-white">
                    </div>
                    
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[500px]">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-[9px] text-slate-400 uppercase tracking-widest">
                                        <th class="py-3 px-4 font-bold w-20 text-center" data-lang="th_number">Номер</th>
                                        <th class="py-3 px-4 font-bold" data-lang="th_publisher">Возвещатель</th>
                                        <th class="py-3 px-4 font-bold text-center" data-lang="th_taken">Взят</th>
                                        <th class="py-3 px-4 font-bold text-right w-24" data-lang="th_action">Действие</th>
                                    </tr>
                                </thead>
                                <tbody id="territories-list" class="divide-y divide-slate-100 text-sm font-medium">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div>
                    <h2 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-3 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-slate-300"></span>
                        <span data-lang="returned_territories">Сданные участки</span>
                    </h2>
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden opacity-80 hover:opacity-100 transition-opacity">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[500px]">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-[9px] text-slate-400 uppercase tracking-widest">
                                        <th class="py-3 px-4 font-bold w-20 text-center" data-lang="th_number">Номер</th>
                                        <th class="py-3 px-4 font-bold" data-lang="th_publisher">Возвещатель</th>
                                        <th class="py-3 px-4 font-bold text-center" data-lang="th_returned_date">Дата сдачи</th>
                                        <th class="py-3 px-4 font-bold text-right w-24" data-lang="th_action">Действие</th>
                                    </tr>
                                </thead>
                                <tbody id="returned-territories-list" class="divide-y divide-slate-100 text-sm font-medium">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="maps-modal" class="fixed inset-0 bg-slate-900/80 z-[70] hidden items-center justify-center p-2 md:p-4 backdrop-blur-sm" onclick="closeMapsModal()">
        <div class="bg-white w-full max-w-4xl rounded-3xl p-4 md:p-6 relative border border-slate-200 h-[95vh] flex flex-col shadow-2xl" onclick="event.stopPropagation()">
            
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                <h2 class="text-xl md:text-2xl font-black text-slate-800 flex items-center gap-2">
                    <svg class="w-6 h-6 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" /></svg>
                    База карт
                </h2>
                <button onclick="closeMapsModal()" class="text-slate-400 hover:text-slate-600 bg-slate-100 hover:bg-slate-200 w-8 h-8 rounded-full flex items-center justify-center transition-colors outline-none font-black text-lg pb-1">×</button>
            </div>

            <div class="flex-grow overflow-y-auto custom-scrollbar flex flex-col gap-4 pr-1">
                
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 flex flex-col gap-3 shrink-0">
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest text-center">Создать новую интерактивную карту</p>
                    <div class="flex gap-2">
                        <input type="number" id="map-num" placeholder="№" class="w-1/4 bg-white border border-slate-200 rounded-xl p-2.5 outline-none focus:border-emerald-500 font-black text-slate-800 text-center text-sm shadow-inner">
                        <input type="text" id="map-city" placeholder="Город / Район" class="w-3/4 bg-white border border-slate-200 rounded-xl p-2.5 outline-none focus:border-emerald-500 font-bold text-slate-700 text-sm shadow-inner">
                    </div>
                    
                    <div class="relative w-full rounded-xl overflow-hidden border border-slate-300 shadow-inner flex-grow flex flex-col">
                        <div id="editor-map" class="w-full flex-grow min-h-[300px] md:min-h-[500px] bg-slate-200 z-10 rounded-xl"></div>
                        <div class="absolute bottom-2 right-2 z-[400] flex gap-2 pointer-events-none">
                            <span class="bg-white/90 text-slate-600 text-[9px] font-bold px-2 py-1 rounded shadow-md border border-slate-200 pointer-events-auto">Нарисуйте многоугольник</span>
                        </div>
                    </div>

                    <button id="save-map-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl transition-colors active:scale-95 text-xs uppercase tracking-widest outline-none shadow-sm shrink-0 mt-2">Сохранить карту</button>
                </div>
                
                <div class="flex flex-col shrink-0 mt-4">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 px-1 text-center">Архив карт</p>
                    <div id="maps-list" class="flex flex-col gap-2">
                        <p class="text-xs italic text-slate-400 text-center py-4">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module" src="territories.js?v=82"></script>
</body>
</html>
