<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Планировка графика</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ui: { bg: '#f8fafc', nav: '#0f172a' }, jw: { treasure: '#0d9488', ministry: '#d97706', living: '#b91c1c' } } } } }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }
        .jw-input { width: 100%; border: none; border-bottom: 1px solid #cbd5e1; background: transparent; font-size: 14px; font-weight: 700; color: #1e293b; padding: 4px 0; outline: none; transition: border-color 0.2s; }
        .jw-input:focus { border-bottom-color: #0f172a; }
        .jw-title-input { font-size: 12px; font-weight: 700; color: #475569; width: 100%; border: none; outline: none; background: transparent; }
    </style>
</head>
<body class="bg-white text-slate-800 font-sans pb-24 md:pb-6 relative">

    <nav class="fixed bottom-0 left-0 w-full bg-ui-nav flex flex-row items-center justify-center z-50 md:top-0 md:h-screen md:w-20 md:flex-col md:justify-start md:py-6 pb-safe border-t border-slate-800 md:border-t-0 no-print">
        <a href="index.html" class="flex flex-col items-center justify-center py-4 w-full md:flex-none md:mb-4 outline-none transition-colors text-slate-400 hover:text-white">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
        </a>
    </nav>

    <main class="w-full max-w-3xl mx-auto px-4 py-6 md:pl-28 md:pr-6">
        
        <div class="flex items-center justify-between bg-slate-100 p-4 rounded-md mb-8">
            <div class="flex items-center gap-3">
                <svg class="w-6 h-6 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <input type="week" id="week-selector" onchange="loadSchedule()" class="bg-transparent font-black text-slate-800 text-lg outline-none cursor-pointer">
            </div>
            <button onclick="saveSchedule()" id="save-btn" class="bg-slate-800 text-white text-xs font-bold uppercase tracking-widest px-4 py-2 rounded-md hover:bg-slate-700 transition-colors shadow-sm outline-none">Сохранить</button>
        </div>

        <datalist id="list-brothers"></datalist>
        <datalist id="list-school"></datalist>

        <div id="schedule-form" class="space-y-10 hidden">
            
            <div class="flex items-end gap-4 border-b border-slate-200 pb-4">
                <div class="w-1/3 shrink-0"><input type="text" id="part-chairman" list="list-brothers" class="jw-input" placeholder="Имя брата"></div>
                <div class="w-2/3 text-sm font-bold text-slate-700">Председатель <span class="text-slate-400 font-normal text-xs">(3 мин.)</span></div>
            </div>

            <div>
                <h2 class="flex items-center gap-2 font-black text-jw-treasure uppercase tracking-widest mb-4 border-b border-slate-200 pb-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    Сокровища из слова бога
                </h2>
                
                <div class="space-y-6">
                    <div class="flex items-end gap-4 bg-slate-50 p-3 rounded-md">
                        <div class="w-1/3 shrink-0"><input type="text" id="part-treasure-name" list="list-brothers" class="jw-input" placeholder="Имя брата"></div>
                        <div class="w-2/3 flex flex-col">
                            <input type="text" id="part-treasure-title" class="jw-title-input text-jw-treasure" placeholder="Тема речи (10 мин.)">
                        </div>
                    </div>
                    
                    <div class="flex items-end gap-4">
                        <div class="w-1/3 shrink-0"><input type="text" id="part-gems-name" list="list-brothers" class="jw-input" placeholder="Имя брата"></div>
                        <div class="w-2/3 flex flex-col">
                            <span class="text-sm font-bold text-slate-700">Духовные жемчужины <span class="text-slate-400 font-normal text-xs">(10 мин.)</span></span>
                        </div>
                    </div>
                    
                    <div class="flex items-end gap-4">
                        <div class="w-1/3 shrink-0"><input type="text" id="part-reading-name" list="list-school" class="jw-input" placeholder="Участник школы"></div>
                        <div class="w-2/3 flex flex-col">
                            <span class="text-sm font-bold text-slate-700">Чтение Библии <span class="text-slate-400 font-normal text-xs">(4 мин.)</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="flex items-center gap-2 font-black text-jw-ministry uppercase tracking-widest mb-4 border-b border-slate-200 pb-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
                    Оттачиваем навыки служения
                </h2>
                
                <div id="ministry-parts" class="space-y-6">
                    </div>
            </div>

            <div>
                <h2 class="flex items-center gap-2 font-black text-jw-living uppercase tracking-widest mb-4 border-b border-slate-200 pb-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    Христианская жизнь
                </h2>
                
                <div class="space-y-6">
                    <div class="flex items-end gap-4">
                        <div class="w-1/3 shrink-0"><input type="text" id="part-local-name" list="list-brothers" class="jw-input" placeholder="Имя брата"></div>
                        <div class="w-2/3 flex flex-col">
                            <span class="text-sm font-bold text-slate-700">Местные потребности <span class="text-slate-400 font-normal text-xs">(15 мин.)</span></span>
                        </div>
                    </div>

                    <div class="flex items-end gap-4 bg-slate-50 p-3 rounded-md">
                        <div class="w-1/3 shrink-0 space-y-3">
                            <input type="text" id="part-cbs-conductor" list="list-brothers" class="jw-input" placeholder="Проводит (Брат)">
                            <input type="text" id="part-cbs-reader" list="list-brothers" class="jw-input" placeholder="Читает (Брат)">
                        </div>
                        <div class="w-2/3 flex flex-col justify-end pb-1">
                            <span class="text-sm font-bold text-slate-700">Изучение Библии в собрании <span class="text-slate-400 font-normal text-xs">(30 мин.)</span></span>
                            <input type="text" id="part-cbs-material" class="jw-title-input mt-1" placeholder="Материал для изучения">
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex items-end gap-4 border-t border-slate-200 pt-4">
                <div class="w-1/3 shrink-0"><input type="text" id="part-prayer" list="list-brothers" class="jw-input" placeholder="Имя брата"></div>
                <div class="w-2/3 text-sm font-bold text-slate-700">Заключительная молитва</div>
            </div>

        </div>

    </main>

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-[100] flex flex-col gap-2 pointer-events-none"></div>
    <script type="module" src="schedule-admin.js"></script>
</body>
</html>
