<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-512.png" type="image/png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="theme-color" content="#0f172a">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GRO-UP">
    <title data-lang="stand_admin_title">Управление стендами</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ui: {
                            bg: '#E1E1EB',
                            nav: '#2A2E33',
                            report: '#0f172a',
                            news: '#0ea5e9',
                            success: '#2dd4bf'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { display: block; height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .date-chip.active { background-color: #1e293b; color: white; border-color: #1e293b; }
        .date-chip.active .date-day { color: #94a3b8; }
        .loc-btn.active { background-color: #1e293b; color: white; border-color: #1e293b; }
        
        @media print {
            body { background-color: white !important; }
            nav, .no-print, button { display: none !important; }
            .print-area { display: block !important; border: none !important; box-shadow: none !important; }
            .print-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: black; }
        }
    </style>
</head>
<body class="bg-ui-bg text-slate-800 min-h-screen font-sans relative">
    
    <nav class="fixed top-0 left-0 w-full bg-ui-nav flex flex-row items-center justify-start z-50 pt-safe border-b-[3px] border-[#2A2E33] no-print">
        <a href="index.html" class="flex items-center justify-center p-3 outline-none transition-colors text-slate-500 hover:text-white" title="Назад">
            <svg class="w-7 h-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
        </a>
    </nav>

    <main class="w-full max-w-4xl mx-auto px-4 pt-16 pb-6">
        
        <div class="mb-6 flex justify-between items-center bg-white p-5 rounded-md shadow-sm border border-slate-200 print-title">
            <h1 class="text-xl md:text-2xl font-black text-slate-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-slate-800" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z" /></svg>
                <span data-lang="stand_admin_title">Стенды (Админ)</span>
            </h1>
        </div>

        <div class="mb-6 flex gap-2 overflow-x-auto custom-scrollbar pb-2 snap-x no-print">
            <button onclick="selectLocation('ML - CupVital')" id="loc-ML-CupVital" class="loc-btn active shrink-0 px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-md text-xs md:text-sm font-black transition-colors outline-none shadow-sm snap-center">ML - CupVital</button>
            <button onclick="selectLocation('ML - Chebská')" id="loc-ML-Chebská" class="loc-btn shrink-0 px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-md text-xs md:text-sm font-black transition-colors outline-none shadow-sm snap-center">ML - Chebská</button>
            <button onclick="selectLocation('Tachov')" id="loc-Tachov" class="loc-btn shrink-0 px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-md text-xs md:text-sm font-black transition-colors outline-none shadow-sm snap-center">Tachov</button>
        </div>

        <section class="mb-8 no-print">
            <h2 class="text-sm font-bold flex items-center gap-2 mb-3 uppercase tracking-widest text-slate-500">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span data-lang="requests_title">Заявки на стенд</span> (<span id="stand-req-count">0</span>)
            </h2>
            <div class="bg-white rounded-md shadow-sm border border-slate-200 overflow-hidden">
                <div id="stand-requests-list" class="divide-y divide-slate-100"></div>
            </div>
        </section>

        <section class="mb-8 no-print">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold flex items-center gap-2 uppercase tracking-widest text-slate-500">
                    <svg class="w-4 h-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    <span data-lang="publishers_title">Возвещатели</span>
                </h2>
                <input type="text" id="search-user" placeholder="Поиск..." class="p-2 px-3 border border-slate-200 rounded-lg outline-none focus:border-indigo-500 w-32 md:w-48 text-xs font-medium bg-white shadow-sm">
            </div>
            <div class="bg-white rounded-md shadow-sm border border-slate-200 overflow-hidden p-3 md:p-4">
                <div id="users-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2 md:gap-3 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar"></div>
            </div>
        </section>

        <section class="mb-8 no-print">
            <h2 class="text-sm font-bold flex items-center gap-2 mb-3 uppercase tracking-widest text-slate-500">
                <svg class="w-4 h-4 text-slate-800" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <span data-lang="schedule_title">Блокировка часов</span>
            </h2>
            <div class="bg-white rounded-md shadow-sm border border-slate-200 overflow-hidden p-4">
                
                <div class="mb-4 relative group">
                    <button onclick="scrollDates(-200)" class="hidden md:flex absolute left-0 top-1/2 -translate-y-1/2 z-10 bg-white/90 text-slate-700 border border-slate-200 rounded-md w-8 h-10 items-center justify-center outline-none shadow-sm hover:bg-slate-50 -ml-4"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg></button>
                    <div id="admin-dates-container" class="flex overflow-x-auto gap-2 pb-2 snap-x snap-mandatory custom-scrollbar scroll-smooth"></div>
                    <button onclick="scrollDates(200)" class="hidden md:flex absolute right-0 top-1/2 -translate-y-1/2 z-10 bg-white/90 text-slate-700 border border-slate-200 rounded-md w-8 h-10 items-center justify-center outline-none shadow-sm hover:bg-slate-50 -mr-4"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg></button>
                </div>
                
                <div class="flex items-center justify-between mb-2 mt-4 px-1 border-b border-slate-100 pb-2 flex-wrap gap-2">
                    <div>
                        <h3 id="admin-selected-date" class="font-black text-slate-700 text-sm">...</h3>
                        <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400" data-lang="click_to_block">Нажмите, чтобы закрыть</span>
                    </div>
                    <button onclick="applyScheduleToAll()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-1.5 px-3 rounded-md text-[10px] uppercase tracking-widest outline-none transition-colors border border-slate-200" data-lang="copy_month">Шаблон на месяц</button>
                </div>
                
                <div id="admin-slots-container" class="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2"></div>
            </div>
        </section>

        <section class="print-area">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-bold flex items-center gap-2 uppercase tracking-widest text-slate-500">
                    <svg class="w-4 h-4 text-slate-800 no-print" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                    <span data-lang="stats_title" class="print-title">Статистика за текущий месяц</span>
                </h2>
                <div class="flex gap-2 no-print">
                    <button onclick="window.print()" class="bg-white border border-slate-200 shadow-sm p-1.5 rounded-md text-slate-500 hover:text-slate-800 outline-none transition-colors" title="Распечатать"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg></button>
                    <button onclick="clearStats()" class="bg-white border border-slate-200 shadow-sm p-1.5 rounded-md text-slate-500 hover:text-red-600 hover:border-red-200 outline-none transition-colors" title="Очистить"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                </div>
            </div>
            <div class="bg-white rounded-md shadow-sm border border-slate-200 overflow-hidden p-4 print-area">
                <div id="stats-container" class="flex flex-col gap-2"></div>
            </div>
        </section>

    </main>

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-[100] flex flex-col gap-2 pointer-events-none no-print"></div>
    <script type="module" src="stand-admin.js?v=22"></script>
</body>
</html>
