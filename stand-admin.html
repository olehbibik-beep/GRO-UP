<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-lang="stand_admin_title">Управление стендами</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ui: { bg: '#f8fafc' } } } } }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { display: block; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .date-chip.active { background-color: #3b82f6; color: white; border-color: #2563eb; }
        .date-chip.active .date-day { color: #bfdbfe; }
        .loc-btn.active { background-color: #0f172a; color: white; border-color: #0f172a; }
    </style>
</head>
<body class="bg-ui-bg text-slate-800 min-h-screen font-sans pb-20">
    
    <nav class="fixed top-0 left-0 w-full bg-white border-b border-slate-200 flex items-center h-14 z-50 px-4 shadow-sm">
        <a href="index.html" class="flex items-center text-slate-500 hover:text-blue-600 transition-colors outline-none font-bold text-sm gap-2">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            <span data-lang="btn_back">Назад</span>
        </a>
        <h1 class="mx-auto font-black text-slate-800 absolute left-1/2 -translate-x-1/2 flex items-center gap-2">
            <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z" /></svg>
            <span data-lang="stand_admin_title" class="hidden md:inline">Стенды (Админ)</span>
            <span class="md:hidden">Админ</span>
        </h1>
    </nav>

    <main class="w-full max-w-4xl mx-auto pt-20 px-4">
        
        <div class="mb-6 flex gap-2 overflow-x-auto custom-scrollbar pb-2 snap-x">
            <button onclick="selectLocation('ML - CupVital')" id="loc-ML-CupVital" class="loc-btn active shrink-0 px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-lg text-xs md:text-sm font-black transition-colors outline-none shadow-sm snap-center">ML - CupVital</button>
            <button onclick="selectLocation('ML - Chebská')" id="loc-ML-Chebská" class="loc-btn shrink-0 px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-lg text-xs md:text-sm font-black transition-colors outline-none shadow-sm snap-center">ML - Chebská</button>
            <button onclick="selectLocation('Tachov')" id="loc-Tachov" class="loc-btn shrink-0 px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-lg text-xs md:text-sm font-black transition-colors outline-none shadow-sm snap-center">Tachov</button>
        </div>

        <section class="mb-8">
            <h2 class="text-sm font-bold flex items-center gap-2 mb-3 uppercase tracking-widest text-slate-500">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span data-lang="requests_title">Заявки на стенд</span> (<span id="stand-req-count">0</span>)
            </h2>
            <div class="bg-white rounded-xl shadow-sm border border-amber-100 overflow-hidden">
                <div id="stand-requests-list" class="divide-y divide-slate-50"></div>
            </div>
        </section>

        <section class="mb-8">
            <h2 class="text-sm font-bold flex items-center gap-2 mb-3 uppercase tracking-widest text-slate-500">
                <svg class="w-4 h-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span data-lang="approved_users">Одобренные</span>
            </h2>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden p-3 md:p-4">
                <div id="approved-users-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2 md:gap-3"></div>
            </div>
        </section>

        <section class="mb-8">
            <h2 class="text-sm font-bold flex items-center gap-2 mb-3 uppercase tracking-widest text-slate-500">
                <svg class="w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <span data-lang="schedule_title">Блокировка часов</span>
            </h2>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden p-4">
                
                <div class="mb-4 relative group">
                    <button onclick="scrollDates(-200)" class="hidden md:flex absolute left-0 top-1/2 -translate-y-1/2 z-10 bg-white/90 text-slate-700 border border-slate-200 rounded-lg w-8 h-10 items-center justify-center outline-none shadow-sm hover:bg-slate-50 -ml-4"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg></button>
                    <div id="admin-dates-container" class="flex overflow-x-auto gap-2 pb-2 snap-x snap-mandatory custom-scrollbar scroll-smooth"></div>
                    <button onclick="scrollDates(200)" class="hidden md:flex absolute right-0 top-1/2 -translate-y-1/2 z-10 bg-white/90 text-slate-700 border border-slate-200 rounded-lg w-8 h-10 items-center justify-center outline-none shadow-sm hover:bg-slate-50 -mr-4"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg></button>
                </div>
                
                <div class="flex items-center justify-between mb-2 mt-4 px-1 border-b border-slate-100 pb-2">
                    <h3 id="admin-selected-date" class="font-black text-slate-700 text-sm">...</h3>
                    <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400" data-lang="click_to_block">Нажмите, чтобы закрыть</span>
                </div>
                <div id="admin-slots-container" class="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2"></div>
            </div>
        </section>

        <section>
            <h2 class="text-sm font-bold flex items-center gap-2 mb-3 uppercase tracking-widest text-slate-500">
                <svg class="w-4 h-4 text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                <span data-lang="stats_title">Статистика за текущий месяц</span>
            </h2>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden p-4">
                <div id="stats-container" class="flex flex-col gap-2"></div>
            </div>
        </section>

    </main>

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-[100] flex flex-col gap-2 pointer-events-none"></div>
    <script type="module" src="stand-admin.js?v=20"></script>
</body>
</html>
